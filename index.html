function warReact(a,b){const out=[];if(!started||!REL.length)return out;const nb=new Set();
  for(let i=0;i<N;i++){if(own[i]!==b)continue;for(const j of ST[i].j){const x=own[j];if(x>=0&&x!==a&&x!==b)nb.add(x);}}
  CS[b].ws=Math.min(100,CS[b].ws+15);CS[b].stab=Math.min(100,CS[b].stab+4);
  const cand=[];
  for(let x=0;x<CT.length;x++){if(x===a||x===b||!CS[x].alive||W[x][a]||W[x][b])continue;const near=nb.has(x);if(!major(x)&&!near)continue;
    const ra=REL[x][a],rb=REL[x][b];let t=null,w=CS[x].fac+(near?60:0);
    const ix=LDR[x].ideo,ia=LDR[a].ideo,ib=LDR[b].ideo,ideoC=ix==="dem"&&ia!=="dem"&&rb>-25&&ra<35,same=ix===ia&&ix!=="dem"&&ix!=="neu";
    if(ra>=40&&rb<25||same&&ra>rb+15){relAdd(x,b,-10);relAdd(x,a,5);t=ix==="fas"&&ia==="fas"?"salue l’action de son allié idéologique, "+CT[a].n:"apporte son soutien à "+CT[a].n;}
    else if(rb>=30&&ra<25||ideoC){relAdd(x,a,-12);t=["condamne l’agression de "+CT[a].n,"dénonce une violation du droit international","exige le retrait immédiat des troupes de "+CT[a].n][(Math.random()*3)|0];
      if((rb>=55||ix==="dem"&&ia==="fas")&&!EMB[x][a]&&ix!=="fas"&&major(x)){EMB[x][a]=true;t+=" et décrète un embargo";}
      else if(rb>=55&&major(x)&&Math.random()<.45){const c=cap(b);if(c>=0&&own[c]===b){inf[c]+=1+(CS[x].fac>150?1:0);t+=" et envoie des volontaires";}}}
    else if(near){CS[x].ws=Math.min(100,CS[x].ws+6);const c=cap(x);if(c>=0&&own[c]===x)inf[c]+=1;t="mobilise ses troupes aux frontières";}
    else if(Math.random()<.45)t=["appelle à un cessez-le-feu immédiat","propose sa médiation","se déclare neutre et appelle au calme","réunit d’urgence son conseil de défense"][(Math.random()*4)|0];
    if(t)cand.push([w,x,t]);}
  /* solidarité des blocs */
  if(ERA==="2026"&&HISTM){if(inBloc("NATO",b)&&!inBloc("NATO",a))for(let x=0;x<CT.length;x++){if(x===b||!CS[x].alive||!inBloc("NATO",x)||W[x][a])continue;W[x][a]=W[a][x]=true;WD[x][a]=WD[a][x]=day;relAdd(x,a,-40);log(CT[x].n+" invoque l’article 5 et entre en guerre contre "+CT[a].n+".");if(major(x))cand.push([1e4,x,"invoque l’article 5 de l’OTAN et entre en guerre"]);}
    if(inBloc("EU",b)&&!inBloc("EU",a))for(let x=0;x<CT.length;x++)if(x!==b&&CS[x].alive&&inBloc("EU",x)&&!EMB[x][a])EMB[x][a]=true;}
  cand.sort((p,q)=>q[0]-p[0]);for(const[,x,t]of cand.slice(0,6))out.push([x,t]);return out;}
function capReact(old,by){if(!REL.length)return;for(let x=0;x<CT.length;x++){if(x===old||x===by||!CS[x].alive)continue;if(REL[x][old]>=40)relAdd(x,by,-10);else if(REL[x][by]>=40)relAdd(x,by,3);
  if(major(x)&&LDR[x].ideo!==LDR[by].ideo&&CS[by].n>CS[x].n*1.5)CS[x].ws=Math.min(100,CS[x].ws+4);}}

  for(let x=0;x<CT.length;x++){if(x===a||!CS[x].alive||W[x][a]||AL[x][a])continue;relAdd(x,a,-3);if(LDR[x].ideo==="dem"&&LDR[a].ideo==="fas")relAdd(x,a,-3);}
  const w=CT.map((_,x)=>x).filter(x=>x!==a&&CS[x].alive&&major(x)&&!W[x][a]&&!AL[x][a]&&REL[x][a]<-30);
  for(const x of w){for(let y=0;y<CT.length;y++)if(y!==x&&y!==a&&W[y][a]&&CS[y].alive&&!AL[x][y]&&REL[x][y]>30&&Math.random()<.25){ally(x,y);press({cat:"dip",h:CT[x].n+" et "+CT[y].n+" s’allient face à "+CT[a].n,x:"L’expansion de "+CT[a].n+" inquiète : les deux pays signent un pacte d’assistance mutuelle.",flags:[x,y],pop:major(x)&&major(y)});break;}}}}
